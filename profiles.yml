mini-dbt-project-profile:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST', 'localhost') }}"
      port: "{{ env_var('PG_PORT', '5432') | int }}"
      user: "{{ env_var('PG_USER', 'user') }}"
      password: "{{ env_var('PG_PASSWORD', 'password') }}"
      dbname: "{{ env_var('PG_DATABASE', 'chinook') }}"
      schema: "{{ env_var('PG_SCHEMA', 'dbt_dev') }}"
      threads: 4
